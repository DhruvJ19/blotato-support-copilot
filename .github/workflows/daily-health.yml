name: Daily health check

on:
  schedule:
    # 13:15 UTC, every day. The script exits 0 when BLOTATO_API_KEY is missing.
    - cron: "15 13 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run health
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blotato-health-report
          path: reports/
          if-no-files-found: warn
